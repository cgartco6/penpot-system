events { worker_connections 1024; }

http {
    upstream penpot {
        server penpot-frontend:80;
    }
    upstream strapi {
        server strapi:1337;
    }
    upstream saleor {
        server saleor-api:8000;
    }
    upstream appsmith {
        server appsmith:80;
    }
    upstream payment {
        server payment-service:8001;
    }

    server {
        listen 80;
        server_name localhost;

        location /design/ {
            proxy_pass http://penpot/;
            proxy_set_header Host $host;
        }
        location /cms/ {
            proxy_pass http://strapi/;
            proxy_set_header Host $host;
        }
        location /store/ {
            proxy_pass http://saleor/;
            proxy_set_header Host $host;
        }
        location /apps/ {
            proxy_pass http://appsmith/;
            proxy_set_header Host $host;
        }
        location /api/ {
            proxy_pass http://payment/;
            proxy_set_header Host $host;
        }
        location / {
            return 200 "Penpot System Gateway\nAvailable: /design/, /cms/, /store/, /apps/, /api/\n";
            add_header Content-Type text/plain;
        }
    }
}
